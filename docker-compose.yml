# ==========================================================================
# Docker Compose — Website Profil Pribadi
# --------------------------------------------------------------------------
# Cara pakai singkat:
#   docker compose up -d --build     # build lalu jalankan di background
#   docker compose ps                # cek status (harus "healthy")
#   docker compose logs -f           # lihat log realtime
#   docker compose down              # hentikan & hapus container
#
# Satu-satunya pengaturan yang bisa diubah ada di file .env (lihat .env.example).
# Compose otomatis membaca file .env untuk variabel di bawah, jadi tanpa file itu
# pun situs tetap jalan dengan nilai default 8080.
#
# Catatan: proyek ini sengaja TIDAK memakai extra_hosts
# "host.docker.internal:host-gateway" karena situs statis tidak perlu
# menghubungi host, dan baris itu bermasalah di Podman versi lama.
# ==========================================================================

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: myprofile-web:latest
    container_name: myprofile-web

    # Port yang dibuka di server: "PORT:80".
    # PORT diambil dari variabel .env, default 8080.
    ports:
      - "${APP_PORT:-8080}:80"

    # Catatan: sengaja TIDAK ada "env_file" di sini. Container ini tidak membaca
    # variabel lingkungan apa pun (Nginx menyajikan file statis), dan file .env
    # sudah otomatis dipakai Compose untuk mengisi ${APP_PORT} di atas.
    # Menghapusnya juga membuat file ini kompatibel dengan Docker Compose versi lama
    # (sintaks "required: false" baru ada di Compose v2.24+).

    # Otomatis dijalankan lagi setelah reboot / crash, tapi tidak di-start
    # ulang manual setelah dihentikan dengan "docker compose stop".
    restart: unless-stopped

    # Container hanya perlu filesystem read-only; Nginx cukup menulis ke
    # cache di memori, jadi image-nya tidak bisa diubah dari dalam.
    read_only: true
    tmpfs:
      - /var/cache/nginx
      # Nginx menulis file PID ke /var/run/nginx.pid (lihat docker/nginx.conf).
      # Tanpa baris ini container akan gagal start karena filesystem read-only.
      - /var/run

    # Cegah proses di dalam container menambah hak akses (privilege escalation).
    security_opt:
      - no-new-privileges:true

    # Batasi risiko: container ini tidak butuh kemampuan khusus apa pun.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
      - DAC_OVERRIDE

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

    # Batas log agar disk VPS tidak penuh oleh log container.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # ----------------------------------------------------------------------
    # Opsional: pakai jaringan milik reverse proxy (Nginx Proxy Manager,
    # Caddy, Traefik). Aktifkan blok berikut HANYA jika benar-benar dipakai,
    # dan sesuaikan nama jaringan + blok network di bagian bawah file.
    # ----------------------------------------------------------------------
    # networks:
    #   - proxy-net

# Uncomment kedua blok di bawah bila memakai jaringan reverse proxy di atas.
# "external: true" berarti jaringan sudah dibuat lebih dulu di luar project ini,
# misalnya: docker network create proxy-net
# networks:
#   proxy-net:
#     external: true
