# ==========================================================================
# Header keamanan & privasi  —  Website Profil Pribadi
# --------------------------------------------------------------------------
# File ini di-include pada level "http" di nginx.conf, DAN diulang di setiap
# "location" yang memakai add_header sendiri.
#
# Kenapa harus diulang? Di Nginx, begitu sebuah location mendefinisikan
# add_header, seluruh add_header dari level di atasnya (server/http) TIDAK
# lagi diwarisi. Jadi location untuk aset dan HTML wajib meng-include file ini
# kembali, kalau tidak header keamanan akan hilang hanya pada respons tersebut.
#
# Catatan Content-Security-Policy (CSP):
#   - 'unsafe-inline' + 'unsafe-eval' diperlukan Tailwind Play CDN, karena
#     Tailwind menyusun CSS langsung di browser dari class yang dipakai.
#   - style-src   : fonts.googleapis.com  (stylesheet Google Fonts)
#   - font-src    : fonts.gstatic.com     (file font Inter)
#   - connect-src : formspree.io          (mode Formspree pada form kontak)
#
# Jika kamu mengganti CDN, penyedia font, atau layanan form, sesuaikan
# daftar di bawah. Bila nanti beralih dari Tailwind CDN ke hasil build
# (lihat bagian "Mode produksi Tailwind" di README), 'unsafe-eval' dan
# 'unsafe-inline' bisa dihapus agar CSP jauh lebih ketat.
# ==========================================================================

add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self' https://formspree.io; form-action 'self' mailto:; base-uri 'self'; frame-ancestors 'self'; object-src 'none'" always;

# Melarang browser menebak tipe file (mencegah serangan MIME sniffing).
add_header X-Content-Type-Options "nosniff" always;

# Halaman ini tidak boleh di-embed di situs lain (anti clickjacking).
add_header X-Frame-Options "SAMEORIGIN" always;

# Kirim informasi referrer seminimal mungkin tetapi tetap berguna.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Matikan fitur browser yang tidak dipakai situs statis ini.
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

# Paksa HTTPS selama 1 tahun untuk kunjungan berikutnya.
# Header ini diabaikan browser bila situs diakses lewat HTTP biasa, jadi aman
# walau kamu baru memakai http://IP-server:8080 tanpa domain.
# Tambahkan "; includeSubDomains; preload" hanya jika yakin semua subdomain
# sudah HTTPS dan kamu siap mendaftar ke hsts preload list.
add_header Strict-Transport-Security "max-age=31536000" always;
