# ==========================================================================
# Konfigurasi Nginx untuk Website Profil Pribadi (versi container)
# --------------------------------------------------------------------------
# File ini MENGGANTIKAN /etc/nginx/nginx.conf di dalam image (lihat Dockerfile),
# jadi seluruh perilaku server diatur dari sini.
#
# Yang sudah diatur:
#   - Log ke stdout/stderr  -> terbaca lewat "docker compose logs -f"
#   - gzip untuk aset teks  -> transfer lebih kecil
#   - Cache 1 tahun "immutable" untuk aset, "no-cache" untuk HTML
#   - Header keamanan lengkap (lihat docker/security-headers.conf)
#   - server_tokens off     -> versi Nginx tidak dibocorkan
#   - /healthz              -> dipakai HEALTHCHECK container
#   - File tersembunyi (.env, .git, ...) tidak bisa diakses
#
# Uji konfigurasi tanpa menjalankan server (opsional):
#   docker run --rm -v "%cd%:/work:ro" -w /work nginx:alpine ^
#     nginx -t -c /work/docker/nginx.conf
# ==========================================================================

user  nginx;
worker_processes  auto;          # mengikuti jumlah CPU yang tersedia
pid /var/run/nginx.pid;

events {
    worker_connections  1024;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ---------------------------------------------------------------------
    # Log
    # ---------------------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

    access_log /dev/stdout main;
    error_log  /dev/stderr warn;

    # ---------------------------------------------------------------------
    # Performa dasar
    # ---------------------------------------------------------------------
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    server_tokens       off;     # sembunyikan versi Nginx
    charset             utf-8;

    # ---------------------------------------------------------------------
    # Kompresi (aset teks diperkecil sebelum dikirim)
    # ---------------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/manifest+json
        application/xml
        application/rss+xml
        image/svg+xml;

    # Pastikan manifest PWA selalu dikirim dengan MIME type yang benar.
    # Blok "types" bersifat menambah, jadi isi /etc/nginx/mime.types tetap dipakai.
    types {
        application/manifest+json  webmanifest;
    }

    # ---------------------------------------------------------------------
    # Header keamanan untuk semua respons (detail ada di file snippet)
    # ---------------------------------------------------------------------
    include /etc/nginx/snippets/security-headers.conf;

    server {
        listen       80 default_server;
        # Baris IPv6 di bawah aman di hampir semua sistem. Jika kernel VPS-mu
        # menonaktifkan IPv6 total, hapus baris ini lalu build ulang.
        listen       [::]:80 default_server;
        server_name  _;

        root  /usr/share/nginx/html;
        index index.html;

        # -----------------------------------------------------------------
        # Endpoint kesehatan untuk HEALTHCHECK container
        # -----------------------------------------------------------------
        location = /healthz {
            access_log    off;
            default_type  text/plain;
            return 200 "ok\n";
        }

        # -----------------------------------------------------------------
        # Jangan pernah menyajikan file tersembunyi (.env, .git, dll.)
        # Pengecualian untuk /.well-known/ (dipakai verifikasi TLS/ACME).
        # -----------------------------------------------------------------
        location ~ /\.(?!well-known) {
            deny all;
        }

        # -----------------------------------------------------------------
        # Aset statis: cache 1 tahun (nama file aset jarang berubah)
        # -----------------------------------------------------------------
        location ~* \.(?:css|js|mjs|svg|png|jpe?g|gif|webp|avif|ico|woff2?|ttf|otf|eot|mp4|webm)$ {
            access_log  off;
            add_header  Cache-Control "public, max-age=31536000, immutable" always;

            # Wajib diulang: add_header di sini membatalkan header dari level atas
            include /etc/nginx/snippets/security-headers.conf;

            try_files $uri =404;
        }

        # -----------------------------------------------------------------
        # Berkas SEO: cache singkat 1 jam agar perubahan cepat terbaca
        # -----------------------------------------------------------------
        location ~* ^/(robots\.txt|sitemap\.xml)$ {
            add_header Cache-Control "public, max-age=3600" always;
            include /etc/nginx/snippets/security-headers.conf;
        }

        # -----------------------------------------------------------------
        # Semua HTML: jangan di-cache lama supaya update konten langsung terlihat
        # -----------------------------------------------------------------
        location = / {
            add_header Cache-Control "no-cache, must-revalidate" always;
            include /etc/nginx/snippets/security-headers.conf;
        }

        location = /index.html {
            add_header Cache-Control "no-cache, must-revalidate" always;
            include /etc/nginx/snippets/security-headers.conf;
        }

        # -----------------------------------------------------------------
        # Sisanya: file apa adanya dari root, dan 404 asli (bukan soft 404)
        # bila tidak ditemukan. Soft 404 (selalu mengembalikan index.html)
        # merugikan SEO, jadi sengaja tidak dipakai.
        # -----------------------------------------------------------------
        location / {
            try_files $uri $uri/ =404;
        }
    }
}
